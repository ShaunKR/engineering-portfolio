global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 15s
    timeout server 15s

frontend mqtt
    bind *:1883
    default_backend brokers

backend brokers
    option tcp-check
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server broker-a broker-a:1883 check
    server broker-b broker-b:1883 check backup
